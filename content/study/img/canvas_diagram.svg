<!-- canvas_diagram.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <!-- background -->
  <rect x="0" y="0" width="820" height="420" fill="#f5f5f5"></rect>

  <!-- canvas area -->
  <rect x="60" y="40" width="700" height="320" fill="#ffffff" stroke="#666" stroke-width="2"></rect>
  <text x="65" y="30" font-size="16" fill="#333">Canvas (0,0) at top-left</text>

  <!-- axes -->
  <line x1="60" y1="40" x2="60" y2="370" stroke="#999" stroke-width="2"></line>
  <line x1="60" y1="40" x2="770" y2="40" stroke="#999" stroke-width="2"></line>
  <text x="40" y="55" font-size="14" fill="#333">(0,0)</text>

  <!-- grid (light) -->
  <g stroke="#eee" stroke-width="1">
    <!-- vertical -->
    <line x1="110" y1="40" x2="110" y2="360"></line>
    <line x1="160" y1="40" x2="160" y2="360"></line>
    <line x1="210" y1="40" x2="210" y2="360"></line>
    <line x1="260" y1="40" x2="260" y2="360"></line>
    <line x1="310" y1="40" x2="310" y2="360"></line>
    <line x1="360" y1="40" x2="360" y2="360"></line>
    <line x1="410" y1="40" x2="410" y2="360"></line>
    <line x1="460" y1="40" x2="460" y2="360"></line>
    <line x1="510" y1="40" x2="510" y2="360"></line>
    <line x1="560" y1="40" x2="560" y2="360"></line>
    <line x1="610" y1="40" x2="610" y2="360"></line>
    <line x1="660" y1="40" x2="660" y2="360"></line>
    <line x1="710" y1="40" x2="710" y2="360"></line>
    <line x1="760" y1="40" x2="760" y2="360"></line>
    <!-- horizontal -->
    <line x1="60" y1="90" x2="760" y2="90"></line>
    <line x1="60" y1="140" x2="760" y2="140"></line>
    <line x1="60" y1="190" x2="760" y2="190"></line>
    <line x1="60" y1="240" x2="760" y2="240"></line>
    <line x1="60" y1="290" x2="760" y2="290"></line>
    <line x1="60" y1="340" x2="760" y2="340"></line>
  </g>

  <!-- item 1 -->
  <rect x="80" y="70" width="140" height="70" fill="#cfe8ff" stroke="#2f6ea6" stroke-width="2"></rect>
  <text x="150" y="112" text-anchor="middle" font-size="18" fill="#0f3a5a">EQ-01</text>
  <text x="80" y="160" font-size="14" fill="#333">Canvas.Left=20</text>
  <text x="80" y="180" font-size="14" fill="#333">Canvas.Top=30</text>

  <!-- item 2 -->
  <rect x="300" y="95" width="140" height="70" fill="#d8f7d8" stroke="#2f8a2f" stroke-width="2"></rect>
  <text x="370" y="137" text-anchor="middle" font-size="18" fill="#1f5a1f">EQ-02</text>
  <text x="300" y="185" font-size="14" fill="#333">Canvas.Left=240</text>
  <text x="300" y="205" font-size="14" fill="#333">Canvas.Top=55</text>

  <!-- overlay (zindex) -->
  <rect x="220" y="220" width="240" height="90" fill="#ffd6d6" stroke="#b54a4a" stroke-width="2"></rect>
  <text x="340" y="270" text-anchor="middle" font-size="18" fill="#7a1f1f">Overlay</text>
  <text x="220" y="320" font-size="14" fill="#333">Panel.ZIndex=10 (on top)</text>

  <!-- legend -->
  <rect x="540" y="235" width="210" height="110" fill="#fafafa" stroke="#bbb"></rect>
  <text x="555" y="260" font-size="14" fill="#333">- Absolute positioning</text>
  <text x="555" y="285" font-size="14" fill="#333">- Great for overlays/drag</text>
  <text x="555" y="310" font-size="14" fill="#333">- Weak for responsive layout</text>
</svg>
